name: Coverage Capture

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["lab/or/chimali", "codex/*"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Serialize device access across workflows on the runner
concurrency:
  group: coverage-runner-device
  cancel-in-progress: false

jobs:
  capture:
    name: Unprivileged Coverage Capture
    runs-on: [self-hosted, windows, android-device]
    timeout-minutes: 60
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          fetch-depth: 0

      - name: Checkout trusted measurement harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 997cc3b3ccab94f1f57f5b9c770e98c5b969118f
          path: trusted-harness

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Preflight device check
        shell: pwsh
        run: |
          adb devices
          $online = (adb devices) | Select-String -Pattern "\bdevice\b"
          if (-not $online) {
            Write-Error "No connected Android test device found online."
            exit 2
          }

      - name: Run Coverage Capture
        shell: pwsh
        run: |
          $headSha = "${{ github.event.pull_request.head.sha || github.sha }}"
          $baseSha = "${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          $purpose = if ("${{ github.event_name }}" -eq "pull_request" -or "${{ github.event_name }}" -eq "merge_group") { "Candidate" } else { "Initial" }

          $device = (adb devices | Select-String -Pattern "(\S+)\s+device\b").Matches.Groups[1].Value | Select-Object -First 1
          if (-not $device) {
            Write-Error "No connected capable Android device found online."
            exit 2
          }

          $captureArgs = @(
            "-RepositoryRoot", (Get-Item candidate).FullName,
            "-SourceRevision", $headSha,
            "-Purpose", $purpose,
            "-HarnessRoot", (Get-Item trusted-harness).FullName,
            "-DeviceSerial", $device,
            "-OutputRoot", "$env:RUNNER_TEMP/coverage-runs"
          )
          if ($purpose -eq "Candidate" -and $baseSha) {
            $captureArgs += @("-TargetRevision", $baseSha)
          }

          pwsh -NoProfile -ExecutionPolicy Bypass -File trusted-harness/tools/coverage/capture.ps1 @captureArgs

      - name: Upload Coverage Run Bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-bundle
          path: ${{ runner.temp }}/coverage-runs/*
          retention-days: 14

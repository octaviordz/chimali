name: Coverage Capture

on:
  pull_request:
    branches: ["**"]
    # Synchronize recaptures a PR after its owner incorporates the latest target.
    types: [opened, reopened, synchronize]
  push:
    branches: ["**"]
  merge_group:
    types: [checks_requested]
  repository_dispatch:
    types: [coverage-target-advanced]

permissions:
  contents: read

# Serialize device access across workflows on the runner
concurrency:
  group: coverage-runner-device
  cancel-in-progress: false

jobs:
  capture:
    if: ${{ github.event_name != 'push' || github.ref == format('refs/heads/{0}', vars.COVERAGE_TARGET_REF) || github.ref == vars.COVERAGE_TARGET_REF || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/heads/codex/') || github.ref == 'refs/heads/lab/or/chimali' }}
    name: Unprivileged Coverage Capture
    runs-on: [self-hosted, windows, android-device]
    timeout-minutes: 60
    steps:
      - name: Validate trusted harness pin
        shell: pwsh
        env:
          TRUSTED_HARNESS_SHA: ${{ vars.COVERAGE_HARNESS_SHA }}
          TRUSTED_REPORTER_WORKFLOW_SHA: ${{ vars.COVERAGE_REPORTER_SHA }}
          TRUSTED_COVERAGE_APP_ID: ${{ vars.COVERAGE_APP_ID }}
          TRUSTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          if ($env:TRUSTED_HARNESS_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            Write-Error "COVERAGE_HARNESS_SHA must be configured as a reviewed full commit SHA."
            exit 3
          }
          if ($env:TRUSTED_REPORTER_WORKFLOW_SHA -notmatch '^[0-9a-fA-F]{40}$' -or
              $env:TRUSTED_COVERAGE_APP_ID -notmatch '^[0-9]+$' -or
              $env:TRUSTED_REPOSITORY_ID -notmatch '^[0-9]+$') {
            Write-Error "Protected reporter SHA, Coverage App ID, and repository ID must be configured before capture."
            exit 3
          }

      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.client_payload.pull_request_head_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          path: candidate
          fetch-depth: 0

      - name: Checkout trusted measurement harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.COVERAGE_HARNESS_SHA }}
          path: trusted-harness

      - name: Verify trusted harness checkout
        shell: pwsh
        env:
          TRUSTED_HARNESS_SHA: ${{ vars.COVERAGE_HARNESS_SHA }}
        run: |
          $actual = (git -C trusted-harness rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:TRUSTED_HARNESS_SHA) {
            Write-Error "Checked out measurement harness does not match the configured full-SHA pin."
            exit 3
          }

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Preflight device check
        shell: pwsh
        env:
          COVERAGE_DEVICE_SERIAL: ${{ vars.COVERAGE_DEVICE_SERIAL }}
        run: |
          $serial = $env:COVERAGE_DEVICE_SERIAL
          if ([string]::IsNullOrWhiteSpace($serial)) {
            Write-Error "COVERAGE_DEVICE_SERIAL must identify the configured Android test device."
            exit 2
          }
          $devices = @(adb devices | Select-String -Pattern "^$([regex]::Escape($serial))\s+device$")
          if ($LASTEXITCODE -ne 0 -or $devices.Count -ne 1) {
            Write-Error "The configured Android test device is not uniquely online and authorized."
            exit 2
          }
          $state = (adb -s $serial get-state).Trim()
          if ($LASTEXITCODE -ne 0 -or $state -ne "device") {
            Write-Error "The configured Android test device failed its state check."
            exit 2
          }

      - name: Run Coverage Capture
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_REF: ${{ github.ref }}
          TARGET_REF: ${{ vars.COVERAGE_TARGET_REF || github.event.repository.default_branch }}
          DISPATCH_HEAD_SHA: ${{ github.event.client_payload.pull_request_head_sha }}
          DISPATCH_BASE_SHA: ${{ github.event.client_payload.accepted_base_sha }}
          DISPATCH_PR_NUMBER: ${{ github.event.client_payload.pull_request_number }}
          DISPATCH_TARGET_REF: ${{ github.event.client_payload.target_ref }}
          COVERAGE_DEVICE_SERIAL: ${{ vars.COVERAGE_DEVICE_SERIAL }}
          TRUSTED_HARNESS_SHA: ${{ vars.COVERAGE_HARNESS_SHA }}
          TRUSTED_REPORTER_WORKFLOW_SHA: ${{ vars.COVERAGE_REPORTER_SHA }}
          TRUSTED_COVERAGE_APP_ID: ${{ vars.COVERAGE_APP_ID }}
          TRUSTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          $purpose = "Initial"
          $headSha = $env:PUSH_SHA
          $baseSha = ""
          $targetBranch = $env:TARGET_REF
          if ($targetBranch -match '^refs/heads/') { $targetBranch = $targetBranch.Substring('refs/heads/'.Length) }
          switch ($env:EVENT_NAME) {
            "pull_request" {
              $purpose = "Candidate"
              $headSha = $env:PR_HEAD_SHA
              $baseSha = $env:PR_BASE_SHA
            }
            "merge_group" {
              $purpose = "Candidate"
              $headSha = $env:MERGE_GROUP_HEAD_SHA
              $baseSha = $env:MERGE_GROUP_BASE_SHA
            }
            "push" {
              if ($env:PUSH_REF -ceq "refs/heads/$targetBranch" -and $env:PUSH_BEFORE_SHA -match '^[0-9a-fA-F]{40,64}$') {
                $purpose = "Candidate"
                $baseSha = $env:PUSH_BEFORE_SHA
              }
            }
            "repository_dispatch" {
              $dispatchTarget = $env:DISPATCH_TARGET_REF
              if ($dispatchTarget -match '^refs/heads/') { $dispatchTarget = $dispatchTarget.Substring('refs/heads/'.Length) }
              if ($env:DISPATCH_PR_NUMBER -notmatch '^[1-9][0-9]*$' -or
                  $env:DISPATCH_HEAD_SHA -notmatch '^[0-9a-fA-F]{40,64}$' -or
                  $env:DISPATCH_BASE_SHA -notmatch '^[0-9a-fA-F]{40,64}$' -or
                  $dispatchTarget -cne $targetBranch) {
                Write-Error "Target-advance dispatch has malformed PR, candidate, accepted-base, or target identity."
                exit 2
              }
              $purpose = "Candidate"
              $headSha = $env:DISPATCH_HEAD_SHA
              $baseSha = $env:DISPATCH_BASE_SHA
            }
            default {
              Write-Error "Unsupported capture event: $env:EVENT_NAME"
              exit 3
            }
          }
          if ([string]::IsNullOrWhiteSpace($headSha)) {
            Write-Error "Event $env:EVENT_NAME did not provide the exact source commit SHA."
            exit 2
          }
          if ($purpose -eq "Candidate" -and [string]::IsNullOrWhiteSpace($baseSha)) {
            Write-Error "Event $env:EVENT_NAME did not provide the exact comparison base SHA."
            exit 2
          }
          $checkedOutSha = (git -C candidate rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOutSha -ne $headSha) {
            Write-Error "Candidate checkout $checkedOutSha does not match the event source $headSha."
            exit 2
          }
          if ($purpose -eq 'Candidate') {
            $candidateTreeEvent = if ($env:EVENT_NAME -eq 'repository_dispatch') { 'pull_request' } else { $env:EVENT_NAME }
            $treeIdentityOutput = @(& pwsh -NoProfile -ExecutionPolicy Bypass -File trusted-harness/tools/coverage/validate-candidate-tree.ps1 `
              -RepositoryPath (Get-Item candidate).FullName -SourceSha $headSha -AcceptedBaseSha $baseSha -EventName $candidateTreeEvent 2>&1)
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Candidate does not prove the exact integrated product tree: $($treeIdentityOutput -join ' ')"
              exit 2
            }
            $treeIdentity = ($treeIdentityOutput -join "`n") | ConvertFrom-Json -ErrorAction Stop
            if (-not $treeIdentity.valid -or $treeIdentity.tested_candidate_sha -cne $headSha -or
                $treeIdentity.accepted_base_sha -cne $baseSha -or $treeIdentity.check_destination_sha -cne $headSha) {
              Write-Error "Candidate-tree identity does not match the event head, accepted base, and check destination."
              exit 2
            }
          }

          $device = $env:COVERAGE_DEVICE_SERIAL
          if ([string]::IsNullOrWhiteSpace($device)) {
            Write-Error "COVERAGE_DEVICE_SERIAL must identify the configured Android test device."
            exit 2
          }
          $deviceRows = @(adb devices | Select-String -Pattern "^$([regex]::Escape($device))\s+device$")
          if ($LASTEXITCODE -ne 0 -or $deviceRows.Count -ne 1) {
            Write-Error "The configured Android test device is not uniquely online and authorized."
            exit 2
          }

          $captureArgs = @(
            "-RepositoryRoot", (Get-Item candidate).FullName,
            "-SourceRevision", $headSha,
            "-Purpose", $purpose,
            "-HarnessRoot", (Get-Item trusted-harness).FullName,
            "-DeviceSerial", $device,
            "-OutputRoot", "$env:RUNNER_TEMP/coverage-runs",
            "-TrustedReporterWorkflowSha", $env:TRUSTED_REPORTER_WORKFLOW_SHA,
            "-TrustedReporterSha", $env:TRUSTED_HARNESS_SHA,
            "-TrustedRepositoryId", $env:TRUSTED_REPOSITORY_ID,
            "-TrustedCoverageAppId", $env:TRUSTED_COVERAGE_APP_ID
          )
          if ($purpose -eq "Candidate" -and $baseSha) {
            $captureArgs += @("-TargetRevision", $baseSha)
          }

          pwsh -NoProfile -ExecutionPolicy Bypass -File trusted-harness/tools/coverage/capture.ps1 @captureArgs

      - name: Upload Coverage Run Bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-runs/*
          retention-days: 14

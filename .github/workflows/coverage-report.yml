name: Protected Coverage Report

on:
  workflow_run:
    workflows: ["Coverage Capture"]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  report:
    name: Protected Check Reporter
    runs-on: windows-latest
    environment: coverage-reporting
    steps:
      - name: Validate workflow run provenance
        shell: pwsh
        run: |
          if ("${{ github.event.workflow_run.event }}" -notin @("pull_request", "merge_group", "push")) {
            Write-Error "Unsupported triggering event: ${{ github.event.workflow_run.event }}"
            exit 1
          }
          if ("${{ github.event.workflow_run.conclusion }}" -ne "success" -and "${{ github.event.workflow_run.conclusion }}" -ne "failure") {
            Write-Error "Workflow run conclusion must be completed execution: ${{ github.event.workflow_run.conclusion }}"
            exit 1
          }

      - name: Checkout trusted default-branch harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 997cc3b3ccab94f1f57f5b9c770e98c5b969118f
          path: trusted-harness

      - name: Download capture artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-bundle
          path: run-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Coverage Check
        shell: pwsh
        env:
          APP_ID: ${{ vars.COVERAGE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.COVERAGE_APP_PRIVATE_KEY }}
          INSTALLATION_ID: ${{ vars.COVERAGE_APP_INSTALLATION_ID }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $headSha = $env:WORKFLOW_HEAD_SHA
          $baseSha = $env:WORKFLOW_BASE_SHA
          if ([string]::IsNullOrWhiteSpace($baseSha)) { $baseSha = $headSha }

          # Strict promotion only on verified post-integration workflow run on default branch
          $isDefaultBranchPush = ($env:WORKFLOW_EVENT -eq "push" -and $env:WORKFLOW_HEAD_BRANCH -eq "lab/or/chimali")
          $promoteArgs = @()
          if ($isDefaultBranchPush) {
              $promoteArgs += "-PromoteIntegration"
              $promoteArgs += "-IntegratedCommit"
              $promoteArgs += $headSha
          }

          pwsh -NoProfile -ExecutionPolicy Bypass -File trusted-harness/tools/coverage/report.ps1 `
            -RunBundle (Get-Item run-bundle/* | Select-Object -First 1).FullName `
            -Repository $env:REPOSITORY `
            -HeadSha $headSha `
            -BaseSha $baseSha `
            -AppId $env:APP_ID `
            -AppPrivateKey $env:APP_PRIVATE_KEY `
            -InstallationId $env:INSTALLATION_ID `
            @promoteArgs

name: Protected Coverage Report

on:
  workflow_run:
    workflows: ["Coverage Capture"]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: write
  pull-requests: read

jobs:
  report:
    name: Protected Check Reporter
    if: ${{ github.event.workflow_run.event != 'push' || github.event.workflow_run.head_branch == github.event.repository.default_branch }}
    runs-on: windows-latest
    environment: coverage-reporting
    steps:
      - name: Validate trusted workflow and harness pins
        shell: pwsh
        env:
          EXPECTED_REPORTER_SHA: ${{ vars.COVERAGE_REPORTER_SHA }}
          REPORTER_SHA: ${{ github.workflow_sha }}
          TRUSTED_HARNESS_SHA: ${{ vars.COVERAGE_HARNESS_SHA }}
        run: |
          if ($env:EXPECTED_REPORTER_SHA -notmatch '^[0-9a-fA-F]{40}$' -or
              $env:REPORTER_SHA -cne $env:EXPECTED_REPORTER_SHA -or
              $env:TRUSTED_HARNESS_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            Write-Error "Protected reporter and measurement harness must match configured reviewed full-SHA pins."
            exit 3
          }

      - name: Checkout trusted measurement harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.COVERAGE_HARNESS_SHA }}
          path: trusted-harness
          persist-credentials: false

      - name: Verify trusted harness checkout
        shell: pwsh
        env:
          TRUSTED_HARNESS_SHA: ${{ vars.COVERAGE_HARNESS_SHA }}
        run: |
          $actual = (git -C trusted-harness rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:TRUSTED_HARNESS_SHA) {
            Write-Error "Checked out reporter harness does not match the configured full-SHA pin."
            exit 3
          }

      - name: Validate triggering run identity
        id: run-identity
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
          EXPECTED_WORKFLOW_ID: ${{ vars.COVERAGE_CAPTURE_WORKFLOW_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          $identityDirectory = Join-Path $env:RUNNER_TEMP 'coverage-reporter-identity'
          New-Item -ItemType Directory -Path $identityDirectory -Force | Out-Null
          $eventPath = Join-Path $identityDirectory 'event.json'
          $identityPath = Join-Path $identityDirectory 'identity.json'
          $eventRun = $env:RUN_JSON | ConvertFrom-Json -ErrorAction Stop
          @{ repository = @{ full_name = $env:REPOSITORY }; workflow_run = $eventRun } |
            ConvertTo-Json -Depth 40 | Set-Content -LiteralPath $eventPath -Encoding utf8
          pwsh -NoProfile -ExecutionPolicy Bypass -File trusted-harness/tools/coverage/validate-workflow-run.ps1 `
            -EventPath $eventPath `
            -ExpectedRepository $env:REPOSITORY `
            -ExpectedWorkflowId $env:EXPECTED_WORKFLOW_ID `
            -DefaultBranch $env:DEFAULT_BRANCH `
            -ServerUrl $env:SERVER_URL `
            -Token $env:GITHUB_TOKEN `
            -OutputPath $identityPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $identity = Get-Content -LiteralPath $identityPath -Raw | ConvertFrom-Json -ErrorAction Stop
          "head_sha=$($identity.head_sha)" >> $env:GITHUB_OUTPUT
          "base_sha=$($identity.base_sha)" >> $env:GITHUB_OUTPUT
          "pull_request_head_sha=$($identity.pull_request_head_sha)" >> $env:GITHUB_OUTPUT
          "accepted_base_sha=$($identity.accepted_base_sha)" >> $env:GITHUB_OUTPUT
          "tested_candidate_sha=$($identity.tested_candidate_sha)" >> $env:GITHUB_OUTPUT
          "check_destination_sha=$($identity.check_destination_sha)" >> $env:GITHUB_OUTPUT
          "event=$($identity.event)" >> $env:GITHUB_OUTPUT
          "run_id=$($identity.run_id)" >> $env:GITHUB_OUTPUT
          "run_attempt=$($identity.run_attempt)" >> $env:GITHUB_OUTPUT
          "pull_request_number=$($identity.pull_request_number)" >> $env:GITHUB_OUTPUT

      - name: Checkout tested commit for identity inspection only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: tested-commit
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify this run attempt's artifact digest
        id: artifact
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          RUN_ID: ${{ steps.run-identity.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.run-identity.outputs.run_attempt }}
          HEAD_SHA: ${{ steps.run-identity.outputs.head_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          $artifactName = "coverage-bundle-$($env:RUN_ID)-$($env:RUN_ATTEMPT)"
          $downloadOutput = @(& pwsh -NoProfile -ExecutionPolicy Bypass -File trusted-harness/tools/coverage/download-verified-artifact.ps1 `
            -Repository $env:REPOSITORY -RunId $env:RUN_ID -RunAttempt $env:RUN_ATTEMPT `
            -HeadSha $env:HEAD_SHA -RepositoryId $env:REPOSITORY_ID -ArtifactName $artifactName `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'coverage-run-artifact') `
            -ServerUrl $env:SERVER_URL -Token $env:GITHUB_TOKEN)
          if ($LASTEXITCODE -ne 0) { Write-Error ($downloadOutput -join ' '); exit 1 }
          $download = ($downloadOutput -join "`n") | ConvertFrom-Json -ErrorAction Stop
          "bundle=$($download.bundle_path)" >> $env:GITHUB_OUTPUT
          "artifact_id=$($download.artifact_id)" >> $env:GITHUB_OUTPUT
          "artifact_digest=$($download.digest)" >> $env:GITHUB_OUTPUT

      - name: Checkout trusted accepted coverage evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/codex/coverage-evidence
          path: accepted-evidence
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            baselines
            runs

      - name: Bind artifact and recheck live PR target
        id: binding
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_EVENT: ${{ steps.run-identity.outputs.event }}
          RUN_HEAD_SHA: ${{ steps.run-identity.outputs.head_sha }}
          RUN_BASE_SHA: ${{ steps.run-identity.outputs.base_sha }}
          PR_NUMBER: ${{ steps.run-identity.outputs.pull_request_number }}
          BUNDLE: ${{ steps.artifact.outputs.bundle }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONFIGURED_TARGET_REF: ${{ vars.COVERAGE_TARGET_REF }}
        run: |
          $headSha = $env:RUN_HEAD_SHA
          $candidateHead = (git -C tested-commit rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $candidateHead -cne $headSha) {
            Write-Error "Checked out commit does not match the completed capture run head."
            exit 1
          }
          $manifestPath = Join-Path $env:BUNDLE 'manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { Write-Error "Verified artifact bundle manifest is missing."; exit 1 }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json -ErrorAction Stop
          $integrationEventPath = ''
          $liveEvent = $env:RUN_EVENT
          $resolvedPrNumber = $env:PR_NUMBER
          $dispatchTree = ''
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          if ($env:RUN_EVENT -eq 'pull_request') {
            if ($env:PR_NUMBER -notmatch '^[1-9][0-9]*$') { Write-Error "Expected a validated PR number."; exit 1 }
            $number = [int]$env:PR_NUMBER
            $uri = "$($env:SERVER_URL)/api/v3/repos/$($env:REPOSITORY)/pulls/$number"
            if ($env:SERVER_URL -eq 'https://github.com') { $uri = "https://api.github.com/repos/$($env:REPOSITORY)/pulls/$number" }
            $livePr = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
            $prPath = Join-Path $env:RUNNER_TEMP 'coverage-reporter-identity/live-pr.json'
            $livePr | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $prPath -Encoding utf8
            $prIdentityPath = Join-Path $env:RUNNER_TEMP 'coverage-reporter-identity/live-pr-identity.json'
            pwsh -NoProfile -ExecutionPolicy Bypass -File trusted-harness/tools/coverage/validate-live-pr-target.ps1 `
              -PullRequestPath $prPath -ExpectedRepository $env:REPOSITORY -ExpectedNumber $env:PR_NUMBER `
              -ExpectedHeadSha $headSha -CapturedBaseSha $env:RUN_BASE_SHA `
              -AllowHeadShaChangePendingTreeVerification -OutputPath $prIdentityPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $baseSha = [string](Get-Content -LiteralPath $prIdentityPath -Raw | ConvertFrom-Json -ErrorAction Stop).base_sha
          } elseif ($env:RUN_EVENT -eq 'repository_dispatch') {
            $candidateSha = [string]$manifest.git.source_commit
            $baseSha = [string]$manifest.git.target_commit
            if ($candidateSha -notmatch '^[0-9a-fA-F]{40,64}$' -or $baseSha -notmatch '^[0-9a-fA-F]{40,64}$') {
              Write-Error "Dispatched candidate manifest is missing full source/accepted-base identities."; exit 1
            }
            $targetName = if ($env:CONFIGURED_TARGET_REF) { $env:CONFIGURED_TARGET_REF } else { $env:DEFAULT_BRANCH }
            if ($targetName -match '^refs/heads/') { $targetName = $targetName.Substring('refs/heads/'.Length) }
            if ($targetName -cne $env:DEFAULT_BRANCH) { Write-Error "Configured dispatch target differs from the repository default branch."; exit 1 }
            $dispatchIdentityPath = Join-Path $env:RUNNER_TEMP 'coverage-reporter-identity/dispatched-candidate.json'
            $dispatchIdentityOutput = @(& pwsh -NoProfile -ExecutionPolicy Bypass -File trusted-harness/tools/coverage/validate-dispatched-candidate.ps1 `
              -Repository $env:REPOSITORY -CandidateSha $candidateSha -AcceptedBaseSha $baseSha `
              -ExpectedTargetRef "refs/heads/$targetName" -ServerUrl $env:SERVER_URL -Token $env:GITHUB_TOKEN -OutputPath $dispatchIdentityPath 2>&1)
            if ($LASTEXITCODE -ne 0) { Write-Error ($dispatchIdentityOutput -join ' '); exit 1 }
            $dispatchIdentity = Get-Content -LiteralPath $dispatchIdentityPath -Raw | ConvertFrom-Json -ErrorAction Stop
            $resolvedPrNumber = [string]$dispatchIdentity.pull_request_number
            $dispatchTree = [string]$dispatchIdentity.tree_sha
            $prPath = Join-Path $env:RUNNER_TEMP 'coverage-reporter-identity/live-pr.json'
            $dispatchIdentity.pull_request | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $prPath -Encoding utf8
            $prIdentityPath = Join-Path $env:RUNNER_TEMP 'coverage-reporter-identity/live-pr-identity.json'
            pwsh -NoProfile -ExecutionPolicy Bypass -File trusted-harness/tools/coverage/validate-live-pr-target.ps1 `
              -PullRequestPath $prPath -ExpectedRepository $env:REPOSITORY -ExpectedNumber $resolvedPrNumber `
              -ExpectedHeadSha $candidateSha -CapturedBaseSha $baseSha -AllowHeadShaChangePendingTreeVerification -OutputPath $prIdentityPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $headSha = $candidateSha
            $baseSha = [string](Get-Content -LiteralPath $prIdentityPath -Raw | ConvertFrom-Json -ErrorAction Stop).base_sha
            $liveEvent = 'pull_request'
          } elseif ($env:RUN_EVENT -eq 'merge_group') {
            $parents = @((git -C tested-commit show -s --format=%P $headSha).Trim() -split '\s+' | Where-Object { $_ })
            if ($LASTEXITCODE -ne 0 -or $parents.Count -lt 2) {
              Write-Error "Merge-group head does not contain a verifiable base and merged head parent list."
              exit 1
            }
            $baseSha = [string]$parents[0]
          } else {
            if ([string]$env:DEFAULT_BRANCH -cne [string](Get-Content (Join-Path $env:RUNNER_TEMP 'coverage-reporter-identity/event.json') -Raw | ConvertFrom-Json).workflow_run.head_branch) {
              Write-Error "Target-push run did not originate on the configured default branch."; exit 1
            }
            $targetName = if ($env:CONFIGURED_TARGET_REF) { $env:CONFIGURED_TARGET_REF } else { $env:DEFAULT_BRANCH }
            if ($targetName -match '^refs/heads/') { $targetName = $targetName.Substring('refs/heads/'.Length) }
            if ($targetName -cne $env:DEFAULT_BRANCH) { Write-Error "Configured target ref differs from the repository default branch."; exit 1 }
            $baseSha = [string]$manifest.git.target_commit
            if ($baseSha -notmatch '^[0-9a-fA-F]{40,64}$') { Write-Error "Target-push capture is missing its exact previous accepted target."; exit 1 }
            $integrationEventPath = Join-Path $env:RUNNER_TEMP 'coverage-reporter-identity/target-push-event.json'
            [PSCustomObject]@{ event_type = 'target_push'; repository = $env:REPOSITORY; head_sha = $headSha; base_sha = $baseSha; target_ref = "refs/heads/$targetName" } |
              ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $integrationEventPath -Encoding utf8
          }
          $bundle = $env:BUNDLE
          if ($manifest.git.source_commit -cne $headSha -or $manifest.git.target_commit -cne $baseSha) {
            Write-Error "Sealed capture source/target does not match the workflow event identity."
            exit 1
          }
          $expectedTree = (git -C tested-commit rev-parse "$headSha^{tree}").Trim()
          if ($env:RUN_EVENT -eq 'repository_dispatch') {
            $expectedTree = $dispatchTree
          }
          if (($env:RUN_EVENT -ne 'repository_dispatch' -and $LASTEXITCODE -ne 0) -or $manifest.git.source_tree -cne $expectedTree) {
            Write-Error "Sealed capture tree does not match the tested commit tree."
            exit 1
          }
          $testedCandidateSha = [string]$manifest.git.source_commit
          $testedCandidateTree = [string]$manifest.git.source_tree
          $checkDestinationSha = $headSha
          $pullRequestHeadSha = if ($liveEvent -eq 'pull_request') { $headSha } else { '' }
          $baselineOutput = @(& pwsh -NoProfile -ExecutionPolicy Bypass -File trusted-harness/tools/coverage/resolve-accepted-baseline.ps1 `
            -EvidenceRoot (Get-Item accepted-evidence).FullName `
            -CandidateBundle $bundle `
            -ExpectedTargetCommit $baseSha 2>&1)
          if ($LASTEXITCODE -ne 0) { Write-Error "Trusted accepted baseline is unavailable or stale: $($baselineOutput -join ' ')"; exit 1 }
          $baseline = ($baselineOutput -join "`n") | ConvertFrom-Json -ErrorAction Stop
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
          "head_sha=$headSha" >> $env:GITHUB_OUTPUT
          "base_sha=$baseSha" >> $env:GITHUB_OUTPUT
          "pull_request_head_sha=$pullRequestHeadSha" >> $env:GITHUB_OUTPUT
          "accepted_base_sha=$baseSha" >> $env:GITHUB_OUTPUT
          "tested_candidate_sha=$testedCandidateSha" >> $env:GITHUB_OUTPUT
          "tested_candidate_tree=$testedCandidateTree" >> $env:GITHUB_OUTPUT
          "check_destination_sha=$checkDestinationSha" >> $env:GITHUB_OUTPUT
          "integration_event_path=$integrationEventPath" >> $env:GITHUB_OUTPUT
          "live_event=$liveEvent" >> $env:GITHUB_OUTPUT
          "pull_request_number=$resolvedPrNumber" >> $env:GITHUB_OUTPUT
          "target_ref=$(if ($integrationEventPath) { "refs/heads/$targetName" } else { '' })" >> $env:GITHUB_OUTPUT
          "comparison_bundle=$($baseline.comparison_bundle)" >> $env:GITHUB_OUTPUT
          "accepted_baseline_index=$($baseline.accepted_baseline_index)" >> $env:GITHUB_OUTPUT
          "changed_paths=$($baseline.changed_paths)" >> $env:GITHUB_OUTPUT

      - name: Generate Coverage Check
        shell: pwsh
        env:
          APP_ID: ${{ vars.COVERAGE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.COVERAGE_APP_PRIVATE_KEY }}
          INSTALLATION_ID: ${{ vars.COVERAGE_APP_INSTALLATION_ID }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.binding.outputs.head_sha }}
          PULL_REQUEST_HEAD_SHA: ${{ steps.binding.outputs.pull_request_head_sha }}
          BASE_SHA: ${{ steps.binding.outputs.base_sha }}
          ACCEPTED_BASE_SHA: ${{ steps.binding.outputs.accepted_base_sha }}
          TESTED_CANDIDATE_SHA: ${{ steps.binding.outputs.tested_candidate_sha }}
          TESTED_CANDIDATE_TREE: ${{ steps.binding.outputs.tested_candidate_tree }}
          CHECK_DESTINATION_SHA: ${{ steps.binding.outputs.check_destination_sha }}
          BUNDLE: ${{ steps.binding.outputs.bundle }}
          COMPARISON_BUNDLE: ${{ steps.binding.outputs.comparison_bundle }}
          ACCEPTED_BASELINE_INDEX: ${{ steps.binding.outputs.accepted_baseline_index }}
          CHANGED_PATHS: ${{ steps.binding.outputs.changed_paths }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          LIVE_EVENT: ${{ steps.binding.outputs.live_event }}
          PR_NUMBER: ${{ steps.binding.outputs.pull_request_number }}
          INTEGRATION_EVENT_PATH: ${{ steps.binding.outputs.integration_event_path }}
          TARGET_REF: ${{ steps.binding.outputs.target_ref }}
          SERVER_URL: ${{ github.server_url }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REPORTER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_REPORTER_SHA: ${{ vars.COVERAGE_HARNESS_SHA }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          EXPECTED_APP_ID: ${{ vars.COVERAGE_APP_ID }}
        run: |
          $reportArgs = @(
            '-RunBundle', $env:BUNDLE,
            '-Repository', $env:REPOSITORY,
            '-HeadSha', $env:HEAD_SHA,
            '-BaseSha', $env:BASE_SHA,
            '-PullRequestHeadSha', $env:PULL_REQUEST_HEAD_SHA,
            '-TestedCandidateSha', $env:TESTED_CANDIDATE_SHA,
            '-TestedCandidateTreeSha', $env:TESTED_CANDIDATE_TREE,
            '-CheckDestinationSha', $env:CHECK_DESTINATION_SHA,
            '-ComparisonBundle', $env:COMPARISON_BUNDLE,
            '-AcceptedBaselineIndexPath', $env:ACCEPTED_BASELINE_INDEX,
            '-ChangedPathsFile', $env:CHANGED_PATHS,
            '-ArtifactId', $env:ARTIFACT_ID,
            '-ArtifactDigest', $env:ARTIFACT_DIGEST,
            '-LiveEventName', $env:LIVE_EVENT,
            '-ServerUrl', $env:SERVER_URL,
            '-ActionsToken', $env:ACTIONS_TOKEN,
            '-ExpectedReporterWorkflowSha', $env:EXPECTED_REPORTER_WORKFLOW_SHA,
            '-ExpectedReporterSha', $env:EXPECTED_REPORTER_SHA,
            '-ExpectedRepositoryId', $env:EXPECTED_REPOSITORY_ID,
            '-ExpectedCoverageAppId', $env:EXPECTED_APP_ID,
            '-AppId', $env:APP_ID,
            '-AppPrivateKey', $env:APP_PRIVATE_KEY,
            '-InstallationId', $env:INSTALLATION_ID
          )
          if ($env:PR_NUMBER -match '^[1-9][0-9]*$') { $reportArgs += @('-PullRequestNumber', $env:PR_NUMBER) }
          if (-not [string]::IsNullOrWhiteSpace($env:TARGET_REF)) { $reportArgs += @('-IntegrationTargetRef', $env:TARGET_REF) }
          if ($env:LIVE_EVENT -eq 'push') { $reportArgs += @('-PromoteIntegration', '-IntegrationEventPath', $env:INTEGRATION_EVENT_PATH) }
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/coverage/report.ps1 @reportArgs
        working-directory: trusted-harness

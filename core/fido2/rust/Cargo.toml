[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
passkey-authenticator = { git = "https://github.com/bitwarden/passkey-rs", branch = "main" }
uniffi = { version = "0.25.0", features = ["cli"] }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
log = "0.4"
env_logger = "0.10"
once_cell = "1.18"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "chimali_fido2"

[build-dependencies]
uniffi = { version = "0.25.0", features = ["build"] }

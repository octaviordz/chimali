org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# builtInKotlin=false: project uses explicit kotlin.android plugin for non-KMP modules.
# Required for SQLDelight 2.0.x compatibility (needs KotlinSourceSet 'main').
android.builtInKotlin=false

# KSP: incremental=false required for stability with KMP multi-target builds
ksp.incremental=false

# Disable AGP 9.0 new DSL to maintain compatibility with Kotlin 2.3 classic plugin
android.newDsl=false

# Performance and stability (AGP 9.x)
android.dependency.excludeLibraryComponentsFromConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# KMP: Suppress Android-style directory warnings during migration
kotlin.mpp.androidSourceSetLayoutV2AndroidStyleDirs.nowarn=true

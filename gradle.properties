org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true

# KSP: incremental=false required for stability with KMP multi-target builds
ksp.incremental=false

android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# KMP: Suppress Android-style directory warnings during migration
kotlin.mpp.androidSourceSetLayoutV2AndroidStyleDirs.nowarn=true
org.gradle.configuration-cache=true

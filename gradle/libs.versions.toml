[versions]
agp = "9.1.1"
bouncycastle = "1.80"
kotlin = "2.3.20"
compose = "1.7.3"
compose-bom = "2024.12.01"
compose-compiler = "1.5.8"
koin = "4.1.0"
koin-compiler = "2.1.0"
signum = "3.20.0"
androidx-ktx = "1.12.0"
androidx-lifecycle = "2.7.0"
androidx-activity-compose = "1.8.2"
androidx-appcompat = "1.7.0"
androidx-navigation = "2.7.7"
room = "2.6.1"
sqldelight = "2.0.1"
sqlcipher = "4.13.0"
coroutines = "1.8.0"
detekt = "1.23.5"
ktlint = "12.1.0"
ksp = "2.3.6"
junit = "4.13.2"
junit-jupiter = "5.10.2"
junit-platform = "1.10.2"
mockk = "1.13.8"
biometric = "1.1.0"
security-crypto = "1.0.0"
serialization-json = "1.6.3"
android-camerax = "1.3.4"
mlkit-barcode = "17.3.0"
qrose = "1.1.2"
javax-inject = "1"
androidx-test-ext-junit = "1.1.5"
espresso = "3.5.1"
timber = "5.0.1"
kermit = "2.0.4"
okio = "3.9.0"
kotlinx-datetime = "0.6.0"
kmpworkmanager = "2.3.9"
guava = "31.1-android"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity-compose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidx-navigation" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation-graphics = { group = "androidx.compose.animation", name = "animation-graphics", version.ref = "compose" }

# Koin (replaces Hilt — Constitution §III)
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin" }
# Koin Annotations: @Single, @Factory, @KoinViewModel, @Module, @ComponentScan
koin-annotations = { group = "io.insert-koin", name = "koin-annotations", version.ref = "koin-compiler" }
# KSP code generator for Koin Annotations (produces compile-time-safe module wiring)
koin-ksp-compiler = { group = "io.insert-koin", name = "koin-ksp-compiler", version.ref = "koin-compiler" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }

# Signum — KMP-native cryptography (replaces BouncyCastle in commonMain)
signum-indispensable = { group = "at.asitplus.signum", name = "indispensable", version.ref = "signum" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
# kotlin-test: multiplatform-compatible test assertions (commonTest)
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Legacy: BouncyCastle retained for androidMain until full Signum migration
bouncycastle-provider = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

sqldelight-android = { group = "app.cash.sqldelight", name = "android-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
sqldelight-sqlite-driver = { group = "app.cash.sqldelight", name = "sqlite-driver", version.ref = "sqldelight" }
sqldelight-dialect-sqlite-3-38 = { group = "app.cash.sqldelight", name = "sqlite-3-38-dialect", version.ref = "sqldelight" }

androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json" }

# CameraX + ML Kit (used for Dev Tools QR scanning)
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "android-camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "android-camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "android-camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "android-camerax" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkit-barcode" }
qrose = { group = "io.github.alexzhirkevich", name = "qrose", version.ref = "qrose" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose" }
compose-ui-test = { group = "androidx.compose.ui", name = "ui-test", version.ref = "compose" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
kermit = { group = "co.touchlab", name = "kermit", version.ref = "kermit" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
kmpworkmanager = { group = "dev.brewkits", name = "kmpworkmanager", version.ref = "kmpworkmanager" }
kmpworker-ksp = { group = "dev.brewkits", name = "kmpworker-ksp", version.ref = "kmpworkmanager" }
kmpworker-annotations = { group = "dev.brewkits", name = "kmpworker-annotations", version.ref = "kmpworkmanager" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
